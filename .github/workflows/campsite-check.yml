name: Campsite Availability Checker

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:  # allows manual runs

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run campsite checker
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          ARRIVAL_DATE: ${{ secrets.ARRIVAL_DATE }}
          DEPARTURE_DATE: ${{ secrets.DEPARTURE_DATE }}

          NUM_ADULTS: ${{ secrets.NUM_ADULTS }}
          NUM_CHILDREN: ${{ secrets.NUM_CHILDREN }}
          NUM_INFANTS: ${{ secrets.NUM_INFANTS }}
          NUM_CONCESSION: ${{ secrets.NUM_CONCESSION }}
          GEAR_TYPE: ${{ secrets.GEAR_TYPE }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}

        run: |
          python parkstay_checker.py
